if(b=="$todo"){const X=user(me);X.todo=X.todo||[];let r;if(l.startsWith("qo'sh ")){X.todo.push({t:v.slice(6),d:0});r="Qo'shildi ✅"}else if(l.startsWith("bajarildi")){const i=parseInt(l.slice(9))-1;if(X.todo[i]){X.todo[i].d=1;r="Bajarildi 🎉"}else r="Raqam noto'g'ri"}else if(l.startsWith("o'chir")){const i=parseInt(l.slice(6))-1;if(X.todo[i]){X.todo.splice(i,1);r="O'chirildi"}else r="Raqam noto'g'ri"}else r=X.todo.map((q,i)=>`${i+1}. ${q.d?"✅":"⬜"} ${q.t}`).join("\n")||"Ro'yxat bo'sh";save();return bmsg(id,r)}
if(b=="$game"){const o=["tosh","qaychi","qog'oz"];if(o.includes(l)){const m=o[Math.random()*3|0],win=(l=="tosh"&&m=="qaychi")||(l=="qaychi"&&m=="qog'oz")||(l=="qog'oz"&&m=="tosh");if(win)gain(user(me),5,5);save();return bmsg(id,`Men: ${m}. ${l==m?"Durang":win?"Siz yutdingiz 🎉 +5 🪙":"Men yutdim 😎"}`)}if(l=="zar")return bmsg(id,"🎲 "+(1+Math.random()*6|0));if(l=="son"){c.num=1+Math.random()*10|0;save();return bmsg(id,"1 dan 10 gacha son o'yladim. Toping!")}if(c.num&&/^\d+$/.test(l)){const n=+l;if(n==c.num){c.num=0;gain(user(me),10,10);save();return bmsg(id,"To'g'ri! +10 🪙")}return bmsg(id,n<c.num?"Kattaroq":"Kichikroq")}return bmsg(id,"tosh, qaychi, qog'oz, zar yoki son deb yozing")}
const h=[];c.msgs.slice(-9).forEach(m=>{if(m.k)return;const r=m.from==me?"user":"assistant";if(h.length&&h[h.length-1].role==r)h[h.length-1].content+="\n"+m.txt;else h.push({role:r,content:m.txt})});while(h.length&&h[0].role!="user")h.shift();
h[0].content="Sen NIHGT AI — NIHGTGRAM messenjeridagi do'stona yordamchisan. Qisqa va aniq javob ber; foydalanuvchi qaysi tilda yozsa, shu tilda. Agar xabar 'tarjima:' bilan boshlansa faqat tarjimani ber, 'yaxshila:' bilan boshlansa matnni yaxshilab ber.\n\n"+h[0].content;
const r=await ai1(h);bmsg(id,r||"AI hozir javob bera olmadi.")}

function info(c){const o=c.type=="dm"&&!c.self?user(other(c)):null,ph=c.msgs.filter(m=>m.k=="img"||m.k=="ust").length;return `<div class=info>${o?`${ava(o,84)}<b style="font-size:18px">${nick(o.u)}</b><div class=sm>@${e(o.u)}</div><div class=sm>${e(o.bio||"")}</div><div class=sm>${e(o.status||"")}</div>`:`<div class=av style="width:84px;height:84px;font-size:34px">${c.bot?BOTS[c.bot].n.split(" ")[0]:c.type=="ch"?"📢":c.self?"🔖":"👥"}</div><b>${cname(c)}</b><div class=sm>${e(c.desc||"")}</div>${c.type=="grp"||c.type=="ch"?c.m.map(u=>`<div class=sm>${nick(u)}</div>`).join(""):""}`}<div class=card style="width:100%"><div class=sm>🖼 ${ph} · 💬 ${c.msgs.length}</div></div></div>`}
let dc="#000",dw=5;
function draw(){modal(`<b>Chizish</b><canvas id=cv width=300 height=300 style="width:100%;max-width:300px;background:#fff;border-radius:14px;touch-action:none;align-self:center"></canvas><div class=colrow>${["#000","#e33","#2f5fc4","#1f8a6a","#f90","#c43f8a"].map(c=>`<span style="background:${c}" onclick="dc='${c}'"></span>`).join("")}<input type=range min=2 max=20 value=5 style="width:100px" oninput="dw=+this.value"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="$('#cv').getContext('2d').clearRect(0,0,300,300)">Tozalash</button><button class=p onclick="cvSend(0)">Yuborish</button><button onclick="cvSend(1)">Stiker qilish</button></div>`);const c=$("#cv"),x=c.getContext("2d");x.lineCap="round";x.lineJoin="round";dc="#000";dw=5;let d=0;const pt=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*300/r.width,(ev.clientY-r.top)*300/r.height]};c.onpointerdown=ev=>{d=1;const[a,b]=pt(ev);x.beginPath();x.moveTo(a,b);x.strokeStyle=dc;x.lineWidth=dw;x.lineTo(a+.1,b);x.stroke();c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(!d)return;const[a,b]=pt(ev);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>d=0}

function ustFile(){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,200/Math.max(m.width,m.height));c.width=m.width*s;c.height=m.height*s;c.getContext("2d").drawImage(m,0,0,c.width,c.height);const X=user(me);(X.ust=X.ust||[]).push(c.toDataURL("image/png"));save();panel(3)};m.src=r.result};r.readAsDataURL(i.files[0])};i.click()}

function nstPick(u){modal(`<b>Nik stikeri · ${nick(u)}</b><div style="display:flex;gap:8px"><button class="${user(u).nsa?"":"p"}" onclick="nstPos('${u}',0)" style="flex:1">◀ Nom oldida</button><button class="${user(u).nsa?"p":""}" onclick="nstPos('${u}',1)" style="flex:1">Nom orqasida ▶</button></div><div class=grid style="grid-template-columns:repeat(4,1fr)"><button onclick="nstSet('${u}',null)" style="font-size:12px">Yo'q</button>${PSL().map((s,i)=>`<button onclick="nstSet('${u}',${i})"><img src="${s}" style="width:100%;height:46px;object-fit:contain" alt=""></button>`).join("")}</div>`)}

function pstCard(){const B=PST_B.length+PST_N.length;return `<div class=card><b>Stikerlar (${PSL().length})</b><div class=sm>Rasm tanlang — orqa fon avtomatik kesilib, stiker bo'ladi</div><button class=p onclick="pstAdd()">+ STIKER QO'SHISH</button><div class=grid style="grid-template-columns:repeat(6,1fr)">${PSL().map((s,i)=>`<div style="position:relative"><img src="${s}" style="width:100%;height:42px;object-fit:contain" alt="">${i>=B?`<button class=g onclick="pstDel(${i-B})" style="position:absolute;top:-6px;right:-6px;padding:0;font-size:12px">✕</button>`:""}</div>`).join("")}</div></div>`}
function pstAdd(){if(!can(user(me),"sticker"))return toast("Ruxsat yo'q");const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=()=>{const fs=[...i.files];let n=0;fs.forEach(f=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{(db.pst=db.pst||[]).push(cutBG(m,160).toDataURL("image/png"));save();if(++n==fs.length){view();toast(n+" ta stiker qo'shildi")}};m.src=r.result};r.readAsDataURL(f)})};i.click()}
function pstDel(i){const B=PST_B.length+PST_N.length;db.pst.splice(i,1);db.users.forEach(x=>{if(x.nst==null)return;if(x.nst==B+i)x.nst=null;else if(x.nst>B+i)x.nst--});save();view()}
function cutBG(m,max){const s=Math.min(1,max/Math.max(m.width,m.height)),w=Math.max(1,m.width*s|0),h=Math.max(1,m.height*s|0),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(m,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data,N=w*h,rm=new Uint8Array(N),bc=[0,0,0];[0,w-1,(h-1)*w,N-1].forEach(q=>{for(let k=0;k<3;k++)bc[k]+=a[q*4+k]/4});const df=q=>a[q*4+3]<10?0:Math.max(Math.abs(a[q*4]-bc[0]),Math.abs(a[q*4+1]-bc[1]),Math.abs(a[q*4+2]-bc[2])),T=22,st=[];for(let i=0;i<w;i++){st.push(i,(h-1)*w+i)}for(let j=0;j<h;j++){st.push(j*w,j*w+w-1)}while(st.length){const q=st.pop();if(rm[q]||df(q)>T)continue;rm[q]=1;const px=q%w;if(px>0)st.push(q-1);if(px<w-1)st.push(q+1);if(q>=w)st.push(q-w);if(q<N-w)st.push(q+w)}const ed=[];for(let q=0;q<N;q++){if(rm[q])continue;const px=q%w;if((px>0&&rm[q-1])||(px<w-1&&rm[q+1])||(q>=w&&rm[q-w])||(q<N-w&&rm[q+w]))ed.push(q)}ed.forEach(q=>{const A=Math.min(1,Math.max(.02,(df(q)-8)/40));for(let k=0;k<3;k++)a[q*4+k]=Math.max(0,Math.min(255,(a[q*4+k]-bc[k]*(1-A))/A));a[q*4+3]=A*255|0});for(let q=0;q<N;q++)if(rm[q])a[q*4+3]=0;x.putImageData(d,0,0);return c}
function setLogo(){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,256/Math.max(m.width,m.height));c.width=m.width*s;c.height=m.height*s;c.getContext("2d").drawImage(m,0,0,c.width,c.height);db.logo=c.toDataURL("image/png");save();app();toast("NIHGTGRAM rasmi hamma uchun o'zgardi")};m.src=r.result};r.readAsDataURL(i.files[0])};i.click()}

function cm(id,a){const X=user(me),c=db.chats[id];if(!c)return;const tg=(k,t)=>{X[k]=X[k]||[];const i=X[k].indexOf(id);i<0?X[k].push(id):X[k].splice(i,1);toast(i<0?t[0]:t[1])};
if(a=="pin")tg("pins",["Qadaldi 📌","Qadash olindi"]);
else if(a=="arch")tg("arch",["Arxivlandi 📥","Arxivdan chiqarildi"]);
else if(a=="mute"){X.mute=X.mute||{};X.mute[id]=!X.mute[id];toast(X.mute[id]?"Ovozsiz 🔕":"Ovoz yoqildi 🔔")}
else if(a=="read"){mark(c);toast("O'qilgan deb belgilandi")}
else if(a=="prof"){closeM();return profOpen(other(c))}
else if(a=="clr"){if(!confirm("Barcha xabarlar o'chiriladi?"))return;c.msgs=[]}
else if(a=="del"){if(c.official){return toast("Rasmiy kanaldan chiqib bo'lmaydi")}const dm=c.type=="dm"||c.bot||c.self;if(!confirm(dm?"Chat o'chiriladi (ikkala tomondan). Davom etasizmi?":"Chatdan chiqasizmi?"))return;if(dm)delete db.chats[id];else c.m=c.m.filter(x=>x!=me);if(oc==id)oc=null}
save();closeM();view(1);badge()}
const SDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("nihgt_vid",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
const sput=async(k,b)=>{const d=await SDB();return new Promise((res,rej)=>{const t=d.transaction("v","readwrite");t.objectStore("v").put(b,k);t.oncomplete=res;t.onerror=rej})};
const sget=async k=>{const d=await SDB();return new Promise(res=>{const q=d.transaction("v").objectStore("v").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})};
function addStory(){modal(`<b>Yangi hikoya</b><button onclick="closeM();addStoryT()">✍️ Matnli hikoya</button><button class=p onclick="addStoryV()">🎬 Video hikoya</button>`)}
function addStoryT(){const t=prompt("Hikoya matni (24 soat):");if(t){db.stories.push({id:now(),by:me,txt:t,mus:prompt("Musiqa (ixtiyoriy):")||"",t:now(),views:[]});save();view()}}
function addStoryV(){const i=document.createElement("input");i.type="file";i.accept="video/*";i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>60e6)return toast("Video 60 MB dan kichik bo'lsin");toast("Yuklanmoqda...");const k="sv"+now();try{await sput(k,f)}catch(x){return toast("Video saqlanmadi")}closeM();db.stories.push({id:now(),by:me,txt:prompt("Izoh (ixtiyoriy):")||"",mus:"",vid:k,t:now(),views:[]});save();view();toast("Video hikoya qo'yildi ✅")};i.click()}
const _vs0=viewStory;viewStory=function(id){_vs0(id);const s=db.stories.find(x=>x.id==id);if(!s||!s.vid)return;const box=document.querySelector("#ov>div div[style*=gradient]");sget(s.vid).then(b=>{if(!b||!box)return;box.style.padding="0";box.innerHTML=`<video src="${URL.createObjectURL(b)}" controls autoplay playsinline loop style="width:100%;max-height:60vh;border-radius:18px;background:#000"></video>`+(s.txt?`<div style="padding:10px;font-size:16px">${e(s.txt)}</div>`:"")})};
intro();
